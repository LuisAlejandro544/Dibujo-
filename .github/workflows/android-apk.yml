# APK Debug de la app Android de Dibujo (módulo :app con AGP).
#
# Compilación estándar de Android:
#   ./gradlew :app:assembleDebug  →  APK firmado con la clave de debug
#
# El motor C++ del dibujo se compila para Android vía NDK (externalNativeBuild
# en :app) e ingresa al APK como libdibujo_engine.so, de modo que en el
# dispositivo corre el motor nativo (MotorNativo por JNI) y no el respaldo.
#
# El modelo IA de limpiar trazos ("Buril") NO vive en git (pesa). Su buzon es
# la release `modelo-buril`: la llena Kaggle con `tools/buril_kaggle.ipynb`
# (Colab `tools/buril_colab.ipynb` entrena y reanuda desde la release de
# checkpoints; como respaldo, el workflow `entrenar-limpiar-trazos-planb.yml`).
# Este workflow baja el `.tflite` de esa release y lo copia a
# `app/src/main/assets/modelos/` antes de compilar. Si la release no existe, el
# APK se arma igual y la app cae al adelgazado algorítmico.
#
# Ademas, si existe la release de checkpoints (tag en `tag_checkpoints`, por
# defecto `checkpoints-buril`), baja los ultimos pesos/estado y los publica como
# artefacto de la corrida. Los checkpoints NO entran al APK (el APK usa el
# `.tflite`); sirven para reanudar/inspeccionar el entrenamiento desde la pagina
# de Actions.
#
# Se activa manualmente (workflow_dispatch) y en cada PR contra main,
# así el APK que sale del repo siempre es compilable y verificable.

name: "APK Android (assembleDebug)"

on:
  workflow_dispatch:
    inputs:
      usar_cache:
        description: 'Usar cache de Gradle (opcional: desmarcar para build frío)'
        type: boolean
        default: true
      tag_checkpoints:
        description: 'Tag de la release con checkpoints (vacío = no bajar)'
        type: string
        default: 'checkpoints-buril'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk-android:
    name: Compilar APK Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar todo el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Preparar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de Gradle (opcional)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ !inputs.usar_cache }}

      - name: Descargar el modelo Buril de la release `modelo-buril`
        id: modelo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/modelos
          if gh release view modelo-buril >/dev/null 2>&1; then
            gh release download modelo-buril \
              --pattern 'limpiar_trazos.*' --dir .cache/modelos --clobber
            echo "encontrado=true" >> "$GITHUB_OUTPUT"
          else
            echo "encontrado=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar checkpoints de la release (si existe)
        id: checkpoints
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_CHECKPOINTS: ${{ inputs.tag_checkpoints || 'checkpoints-buril' }}
        run: |
          mkdir -p .cache/modelos/checkpoints
          if [ -n "$TAG_CHECKPOINTS" ] && gh release view "$TAG_CHECKPOINTS" >/dev/null 2>&1; then
            gh release download "$TAG_CHECKPOINTS" \
              --pattern 'estado.json' --dir .cache/modelos/checkpoints --clobber || true
            gh release download "$TAG_CHECKPOINTS" \
              --pattern '*.weights.h5' --dir .cache/modelos/checkpoints --clobber || true
            gh release download "$TAG_CHECKPOINTS" \
              --pattern 'optimizador.npz' --dir .cache/modelos/checkpoints --clobber || true
            if [ -f .cache/modelos/checkpoints/estado.json ] || ls .cache/modelos/checkpoints/*.weights.h5 >/dev/null 2>&1; then
              echo "encontrado=true" >> "$GITHUB_OUTPUT"
            else
              echo "encontrado=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "encontrado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No hay release '$TAG_CHECKPOINTS'; se sigue sin checkpoints."
          fi
          ls -la .cache/modelos/checkpoints || true

      - name: Inyectar el modelo Buril en los assets del APK
        run: |
          mkdir -p app/src/main/assets/modelos
          if [ -f .cache/modelos/limpiar_trazos.tflite ]; then
            cp .cache/modelos/limpiar_trazos.tflite app/src/main/assets/modelos/
            cp .cache/modelos/limpiar_trazos.json app/src/main/assets/modelos/ 2>/dev/null || true
            echo "Modelo Buril inyectado: $(stat -c%s app/src/main/assets/modelos/limpiar_trazos.tflite) bytes"
            if [ -f .cache/modelos/limpiar_trazos.json ]; then
              echo "Manifiesto del modelo:"
              cat .cache/modelos/limpiar_trazos.json
            fi
          else
            echo "::warning::No hay modelo Buril en la release; el APK se arma sin el modelo entrenado y la app cae al adelgazado algorítmico. Corre el cuaderno de Kaggle 'tools/buril_kaggle.ipynb' (o el workflow 'Entrenar limpiador de trazos (Plan B)') para publicarlo."
          fi

      - name: Compilar la app Android (Gradle + Compose + motor C++ con NDK)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verificar artefactos (APK + motor nativo)
        run: |
          ls -la app/build/outputs/apk/debug
          find app/build/intermediates/stripped_native_libs -name "libdibujo_engine.so" -exec ls -la {} \;
          ls -la app/src/main/assets/modelos || true

      - name: Subir artefacto (APK debug firmado)
        uses: actions/upload-artifact@v4
        with:
          name: Dibujo-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir checkpoints descargados (si se encontraron)
        if: steps.checkpoints.outputs.encontrado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buril-checkpoints
          path: .cache/modelos/checkpoints
          if-no-files-found: ignore
          retention-days: 30
