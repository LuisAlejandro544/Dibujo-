# APK Debug de la app Android de Dibujo (módulo :app con AGP).
#
# Compilación estándar de Android:
#   ./gradlew :app:assembleDebug  →  APK firmado con la clave de debug
#
# El motor C++ del dibujo se compila para Android vía NDK (externalNativeBuild
# en :app) e ingresa al APK como libdibujo_engine.so, de modo que en el
# dispositivo corre el motor nativo (MotorNativo por JNI) y no el respaldo.
#
# El modelo IA de limpiar trazos NO vive en git (pesa); este workflow lo
# restaura de la cache que llena `entrenar-limpiar-trazos-planb.yml` y lo copia
# a `app/src/main/assets/modelos/` antes de compilar. Si la cache no existe, el
# APK se arma igual y la app cae al adelgazado algorítmico.
#
# Se activa manualmente (workflow_dispatch) y en cada PR contra main,
# así el APK que sale del repo siempre es compilable y verificable.

name: "APK Android (assembleDebug)"

on:
  workflow_dispatch:
    inputs:
      usar_cache:
        description: 'Usar cache de Gradle (opcional: desmarcar para build frío)'
        type: boolean
        default: true
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk-android:
    name: Compilar APK Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar todo el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Preparar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de Gradle (opcional)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ !inputs.usar_cache }}

      - name: Restaurar el modelo IA entrenado (cache, fuera de git)
        id: modelo
        uses: actions/cache/restore@v4
        with:
          path: .cache/modelos
          key: modelo-limpiar-trazos-v1-${{ github.run_id }}
          restore-keys: |
            modelo-limpiar-trazos-v1-

      - name: Inyectar el modelo IA en los assets del APK
        run: |
          mkdir -p app/src/main/assets/modelos
          if [ -f .cache/modelos/limpiar_trazos.tflite ]; then
            cp .cache/modelos/limpiar_trazos.tflite app/src/main/assets/modelos/
            echo "Modelo IA inyectado: $(stat -c%s app/src/main/assets/modelos/limpiar_trazos.tflite) bytes"
          else
            echo "::warning::No hay modelo IA en la cache; el APK se arma sin el modelo entrenado y la app cae al adelgazado algorítmico. Corre el workflow 'Entrenar limpiador de trazos (Plan B)' para generarlo."
          fi

      - name: Compilar la app Android (Gradle + Compose + motor C++ con NDK)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Verificar artefactos (APK + motor nativo)
        run: |
          ls -la app/build/outputs/apk/debug
          find app/build/intermediates/stripped_native_libs -name "libdibujo_engine.so" -exec ls -la {} \;
          ls -la app/src/main/assets/modelos || true

      - name: Subir artefacto (APK debug firmado)
        uses: actions/upload-artifact@v4
        with:
          name: Dibujo-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
