# Plan B - entrena el limpiador de trazos con datos comerciales (Quick, Draw!).
#
# RESPALDO del entrenamiento por Colab. La via recomendada es el cuaderno
# `tools/buril_colab.ipynb` (GPU gratis); este workflow queda
# para cuando no haya Colab a mano.
#
# El modelo `.tflite` NO se versiona en el repo (ver `.gitignore`): este workflow
# lo entrena y lo publica en la release `modelo-buril` (el mismo buzon que llena
# Colab), y ademas lo sube como artefacto. El workflow `android-apk.yml` baja el
# modelo de esa release y lo inyecta en `app/src/main/assets/modelos/` antes de
# `assembleDebug`, asi el APK lo incluye sin que la rama main cargue el binario.
#
# Datos: `tools/preparar_dataset_limpiar_trazos_planb.py` fabrica los pares
# (repasado -> limpio) desde Quick, Draw! (CC BY 4.0), y
# `tools/buril.py --pares ...` recorta los parches y entrena.
# El `.npz` se cachea en la release `dataset-buril` (buzón compartido con el
# cuaderno de Colab y con este workflow), asi que reentrenar no vuelve a bajar
# ni preprocesar. La version del dataset y del modelo se pasa con `version`.
#
# Disparo: SOLO manual (workflow_dispatch). Antes tambien corria al tocar los
# archivos del pipeline, pero eso lanzaba un entrenamiento de ~90 min en CPU en
# cada edicion (y encima solia pasar el timeout sin publicar). El entrenamiento
# normal ahora corre en Kaggle (`tools/buril_kaggle.ipynb`); este workflow queda
# como respaldo manual. Para lanzarlo desde Actions: Run workflow.

name: "Entrenar limpiador de trazos (Plan B, Quick Draw)"

on:
  workflow_dispatch:
    inputs:
      lado:
        description: "Lado del cache del dataset en px"
        default: "512"
        type: string
      por_categoria:
        description: "Dibujos maximos por categoria"
        default: "200"
        type: string
      epocas:
        description: "Epocas de entrenamiento"
        default: "60"
        type: string
      aumentos:
        description: "Copias aumentadas por muestra de entrenamiento"
        default: "3"
        type: string
      banda:
        description: "Radio (px) de la banda objetivo (0 = linea de 1 px, 1 = 3 px)"
        default: "1"
        type: string
      parches_por_imagen:
        description: "Parches 64x64 maximos por hoja del dataset"
        default: "16"
        type: string
      version:
        description: "Version del dataset y del modelo (release)"
        default: "v1.0.0-experimental.1a"
        type: string

permissions:
  contents: write

concurrency:
  group: entrenar-limpiar-trazos-planb
  cancel-in-progress: false

jobs:
  entrenar:
    name: Entrenar y cachear el modelo (fuera de git)
    runs-on: ubuntu-latest
    # El dataset es liviano (cabeceras de Quick Draw) y la red es chica; sobra
    # margen frente al corte del runner.
    timeout-minutes: 90
    env:
      LADO: ${{ inputs.lado || '512' }}
      POR_CATEGORIA: ${{ inputs.por_categoria || '200' }}
      EPOCAS: ${{ inputs.epocas || '60' }}
      AUMENTOS: ${{ inputs.aumentos || '3' }}
      BANDA: ${{ inputs.banda || '1' }}
      PARCHES: ${{ inputs.parches_por_imagen || '16' }}
      VERSION: ${{ inputs.version || 'v1.0.0-experimental.1a' }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (numpy + tensorflow-cpu)
        run: python -m pip install --upgrade pip numpy tensorflow-cpu

      - name: Autoprueba del pipeline de datos (sin red)
        run: python3 tools/preparar_dataset_limpiar_trazos_planb.py autoprueba

      - name: Restaurar el dataset .npz de la release `dataset-buril`
        id: dataset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/limpiar_trazos_planb/procesado
          ASSET="pares_esq_lado${LADO}_pc${POR_CATEGORIA}_${VERSION}.npz"
          if gh release view dataset-buril >/dev/null 2>&1; then
            gh release download dataset-buril --pattern "$ASSET" \
              --dir .cache/limpiar_trazos_planb/procesado --clobber && \
              mv ".cache/limpiar_trazos_planb/procesado/$ASSET" \
                 ".cache/limpiar_trazos_planb/procesado/pares_esq_lado${LADO}.npz"
          fi

      - name: Preparar el dataset si falta el npz
        run: |
          NPZ=".cache/limpiar_trazos_planb/procesado/pares_esq_lado${LADO}.npz"
          if [ ! -f "$NPZ" ]; then
            python3 tools/preparar_dataset_limpiar_trazos_planb.py todo \
              --lado "$LADO" --por-categoria "$POR_CATEGORIA" --version "$VERSION"
          else
            echo "Dataset ya disponible: $NPZ"
          fi

      - name: Cachear el .npz en la release `dataset-buril`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="pares_esq_lado${LADO}_pc${POR_CATEGORIA}_${VERSION}.npz"
          gh release view dataset-buril >/dev/null 2>&1 || \
            gh release create dataset-buril \
              --title "Dataset Buril (cache del .npz)" \
              --notes "Cache del dataset comercial (Quick, Draw!, CC BY 4.0) que usa \`tools/buril.py\`. Buzón compartido con el cuaderno de Colab \`tools/buril_colab.ipynb\`."
          gh release upload dataset-buril \
            ".cache/limpiar_trazos_planb/procesado/pares_esq_lado${LADO}.npz#${ASSET}" \
            --clobber

      - name: Entrenar el limpiador de trazos
        run: |
          python3 tools/buril.py \
            --pares ".cache/limpiar_trazos_planb/procesado/pares_esq_lado${LADO}.npz" \
            --salida "$GITHUB_WORKSPACE/.cache/modelos/limpiar_trazos.tflite" \
            --epocas "$EPOCAS" --aumentos "$AUMENTOS" \
            --banda "$BANDA" \
            --parches-por-imagen "$PARCHES" \
            --nombre Buril --version "$VERSION"

      - name: Subir el modelo como artefacto (fuera de git)
        uses: actions/upload-artifact@v4
        with:
          name: modelo-limpiar-trazos-planb
          path: |
            .cache/modelos/limpiar_trazos.tflite
            .cache/modelos/limpiar_trazos.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar el modelo en la release `modelo-buril` (buzón del APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modelo-buril >/dev/null 2>&1 || \
            gh release create modelo-buril \
              --title "Modelo Buril ${VERSION}" \
              --notes "Modelo \`limpiar_trazos.tflite\` (limpiador de trazos, float16), version ${VERSION}. Lo publica el workflow de entrenamiento o el cuaderno de Colab; \`android-apk.yml\` lo inyecta en el APK."
          gh release edit modelo-buril --title "Modelo Buril ${VERSION}" \
            --notes "Modelo \`limpiar_trazos.tflite\` (limpiador de trazos, float16), version ${VERSION}. Dataset \`pares_esq_lado${LADO}_pc${POR_CATEGORIA}_${VERSION}.npz\` de la release \`dataset-buril\`; \`android-apk.yml\` lo inyecta en el APK."
          gh release upload modelo-buril \
            .cache/modelos/limpiar_trazos.tflite \
            .cache/modelos/limpiar_trazos.json \
            --clobber
