# Plan B - dataset comercial para limpiar trazos (Quick, Draw!).
#
# A diferencia del Plan A (SketchBench), aca los datos tienen licencia que
# permite uso comercial y NO obliga a liberar la app como open source:
# Quick, Draw! (Google) es CC BY 4.0 (solo pide atribucion).
#
# El script baja solo la cabecera de cada categoria (rango HTTP), fabrica los
# pares (repasado -> limpio) por simulacion y cachea un `.npz` con el mismo
# formato que el Plan A, que consume el entrenamiento:
# `tools/entrenar_limpiar_trazos.py --pares ...`.
#
# Fases separadas y cacheadas: la cabecera de cada ndjson y el `.npz` viven en
# la cache de Actions, asi que una corrida cortada se retoma. El `key` del cache
# incluye el hash del script y del registro: si cambia la generacion, se rehace.
#
# Disparo: manual (workflow_dispatch) o al tocar los archivos del Plan B.

name: "Plan B - dataset comercial limpiar trazos (Quick, Draw!)"

on:
  workflow_dispatch:
    inputs:
      lado:
        description: "Lado del cache en px (hojas completas; los parches siguen siendo 64)"
        default: "512"
        type: string
      por_categoria:
        description: "Dibujos maximos por categoria"
        default: "100"
        type: string
      forzar:
        description: "Rehacer aunque ya exista la cache"
        type: boolean
        default: false
  push:
    paths:
      - "tools/datasets_limpiar_trazos_planb.json"
      - "tools/preparar_dataset_limpiar_trazos_planb.py"
      - ".github/workflows/preparar-dataset-limpiar-trazos-planb.yml"

permissions:
  contents: read

concurrency:
  group: preparar-dataset-limpiar-trazos-planb
  cancel-in-progress: false

jobs:
  dataset:
    name: Descargar y preprocesar Quick, Draw! (Plan B)
    runs-on: ubuntu-latest
    # El Plan B es liviano (solo la cabecera de cada categoria + generacion
    # vectorizada); el corte real del runner es ~1 h y sobra margen.
    timeout-minutes: 45
    env:
      LADO: ${{ inputs.lado || '512' }}
      POR_CATEGORIA: ${{ inputs.por_categoria || '100' }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del Plan B (numpy)
        run: python -m pip install --upgrade pip numpy

      - name: Autoprueba del pipeline (sin red)
        run: python3 tools/preparar_dataset_limpiar_trazos_planb.py autoprueba

      - name: Cache de las cabeceras crudas (quickdraw)
        uses: actions/cache@v4
        with:
          path: .cache/limpiar_trazos_planb/crudos
          key: dataset-planb-crudos-v1-${{ hashFiles('tools/datasets_limpiar_trazos_planb.json') }}

      - name: Cache de pares procesados
        uses: actions/cache@v4
        with:
          path: .cache/limpiar_trazos_planb/procesado
          key: dataset-planb-pares-v1-${{ hashFiles('tools/datasets_limpiar_trazos_planb.json', 'tools/preparar_dataset_limpiar_trazos_planb.py') }}-${{ env.LADO }}-pc${{ env.POR_CATEGORIA }}

      - name: Bajar las cabeceras de Quick, Draw! (reanudable)
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" = "true" ]; then
            EXTRA="--forzar"
          fi
          python3 tools/preparar_dataset_limpiar_trazos_planb.py descargar $EXTRA

      - name: Preprocesar (fabricar pares repasado -> limpio)
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" = "true" ]; then
            EXTRA="--forzar"
          fi
          python3 tools/preparar_dataset_limpiar_trazos_planb.py preprocesar \
            --lado "$LADO" --por-categoria "$POR_CATEGORIA" $EXTRA

      - name: Estado del cache
        run: python3 tools/preparar_dataset_limpiar_trazos_planb.py estado

      - name: Subir los pares como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dataset-limpiar-trazos-planb-lado${{ env.LADO }}
          path: |
            .cache/limpiar_trazos_planb/procesado/*.npz
            .cache/limpiar_trazos_planb/procesado/*.json
          if-no-files-found: error
          retention-days: 14
